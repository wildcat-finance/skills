[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
solc = "0.8.25"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"

# The harness reads only its own tree. No ffi, no absolute paths, no network,
# and no filesystem permission beyond the build output directory.
fs_permissions = [
  { access = "read-write", path = "./out" },
]

[fuzz]
runs = 256
