name: repo

on:
  push:
    paths:
      - "plugins/**"
      - "tests/**"
      - "repo_contract.py"
      - ".python-version"
      - "pyproject.toml"
      - ".claude-plugin/**"
      - ".agents/**"
      - "docs/**"
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/*.yml"
  pull_request:
    paths:
      - "plugins/**"
      - "tests/**"
      - "repo_contract.py"
      - ".python-version"
      - "pyproject.toml"
      - ".claude-plugin/**"
      - ".agents/**"
      - "docs/**"
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/*.yml"

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Repository-wide invariant suite
        run: python3 -m unittest discover -s tests -v
