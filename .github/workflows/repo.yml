name: repo

# The invariant suite is the gate main is protected by, so it runs on every
# pull request without a path filter. Two reasons it cannot be filtered:
#
#   * The suite asserts over paths the filter never listed. Boundary currency
#     reads .horos/boundary.json, the audit tests read audit/, and others read
#     CONTRIBUTORS.md, LICENSE and .gitignore. A pull request touching only
#     those could break the suite and never run it.
#   * A required status check that a pull request never produces blocks that
#     pull request forever. Requiring a path-filtered check would wedge every
#     change outside the filter.
#
# The job takes one to two minutes, so running it unconditionally is cheap.

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Changed plugins carry newer package versions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              BASE_SHA="$(git rev-parse HEAD^)"
            else
              git fetch --no-tags --depth=1 origin main
              BASE_SHA="$(git rev-parse FETCH_HEAD)"
            fi
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "plugin-release: invalid base commit" >&2
            exit 2
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 scripts/plugin_release.py --base "$BASE_SHA" --head "$GITHUB_SHA"
      - name: Repository-wide invariant suite
        run: python3 -m unittest discover -s tests -v
