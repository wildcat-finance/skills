name: pandects

on:
  push:
    paths:
      - "plugins/pandects/**"
      - ".python-version"
      - "pyproject.toml"
      - ".claude-plugin/**"
      - ".agents/**"
      - "AGENTS.md"
      - ".github/workflows/pandects.yml"
  pull_request:
    paths:
      - "plugins/pandects/**"
      - ".python-version"
      - "pyproject.toml"
      - ".claude-plugin/**"
      - ".agents/**"
      - "AGENTS.md"
      - ".github/workflows/pandects.yml"

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Pandects catalogue suite
        run: python3 -m unittest discover -s plugins/pandects/tests -t plugins/pandects -v

      - name: Every law carries its six parts
        run: python3 plugins/pandects/scripts/pandects.py check
