name: dead-code

on:
  push:
    branches:
      - main
    paths:
      - '.horos/**'
      - '.dead-code/baseline.json'
      - '.dead-code/suppressions.json'
      - '.github/workflows/dead-code.yml'
      - 'docs/dead-code/**'
      - 'docs/decisions/ADR-053-keep-dead-code-discovery-report-only.md'
      - 'docs/decisions/ADR-062-separate-live-worktree-reports-from-baselines.md'
      - 'docs/promise-machine/dead-code-v1.md'
      - 'schemas/dead-code-report-v1.schema.json'
      - 'schemas/dead-code-report-v2.schema.json'
      - 'schemas/dead-code-suppressions-v1.schema.json'
      - 'scripts/dead_code.py'
      - 'scripts/run_checks.py'
      - 'tests/check-map-v1.json'
      - 'tests/emit_dead_code_report.py'
      - 'tests/test_dead_code.py'
      - ".python-version"
      - "pyproject.toml"
  pull_request:
    paths:
      - '.horos/**'
      - '.dead-code/baseline.json'
      - '.dead-code/suppressions.json'
      - '.github/workflows/dead-code.yml'
      - 'docs/dead-code/**'
      - 'docs/decisions/ADR-053-keep-dead-code-discovery-report-only.md'
      - 'docs/decisions/ADR-062-separate-live-worktree-reports-from-baselines.md'
      - 'docs/promise-machine/dead-code-v1.md'
      - 'schemas/dead-code-report-v1.schema.json'
      - 'schemas/dead-code-report-v2.schema.json'
      - 'schemas/dead-code-suppressions-v1.schema.json'
      - 'scripts/dead_code.py'
      - 'scripts/run_checks.py'
      - 'tests/check-map-v1.json'
      - 'tests/emit_dead_code_report.py'
      - 'tests/test_dead_code.py'
      - ".python-version"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Demonstrate the report-only prototype
        run: |
          python3 scripts/dead_code.py report
          python3 scripts/dead_code.py report --json
          python3 scripts/dead_code.py report --worktree
          python3 scripts/dead_code.py baseline --check > "$RUNNER_TEMP/baseline-check.txt"
          cat "$RUNNER_TEMP/baseline-check.txt"
          python3 scripts/run_checks.py --scope dead-code

      - name: Summarise the report
        if: success()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          baseline = json.loads(
              Path(".dead-code/baseline.json").read_text(encoding="utf-8")
          )
          print("## Dead-code report")
          print()
          print("Candidates are reported, not gated.")
          print()
          print(f"- source commit: {baseline['tree']['commit']}")
          print(f"- git_tree: {baseline['tree']['git_tree']}")
          print(f"- universe: {baseline['universe']['id']}")
          states = ", ".join(
              f"{item['id']}={item['state']}@{item['version'] or 'unknown'}"
              for item in baseline["analysers"]
          )
          print(f"- analysers: {states}")
          print(f"- findings: {len(baseline['findings'])} candidate(s)")
          suppressed = sum(item["suppressed"] for item in baseline["findings"])
          print(f"- suppressed: {suppressed}")
          print("- changes: added=0 resolved=0 stale_suppressions=0")
          captured = Path(
              os.environ["RUNNER_TEMP"], "baseline-check.txt"
          ).read_text(encoding="utf-8")
          reported = [
              line
              for line in captured.splitlines()
              if line.partition(" ")[0] in {"published", "currency", "status"}
          ]
          print()
          print("```text")
          for line in reported:
              print(line)
          print("```")
          PY

      - name: Record an inconclusive failure
        if: failure()
        run: |
          echo '## Dead-code report' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'The command or report contract failed. This run established no dead-code result.' >> "$GITHUB_STEP_SUMMARY"
