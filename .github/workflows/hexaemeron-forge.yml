name: hexaemeron-forge

on:
  push:
    branches:
      - main
    paths:
      - "plugins/hexaemeron/harness/**"
      - ".github/workflows/hexaemeron-forge.yml"
  pull_request:
    paths:
      - "plugins/hexaemeron/harness/**"
      - ".github/workflows/hexaemeron-forge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build with no dependency to fetch
        run: forge build
        working-directory: plugins/hexaemeron/harness
      - name: The vendored closure and the emitter suite
        run: forge test -vv
        working-directory: plugins/hexaemeron/harness
