name: hexaemeron-forge

on:
  push:
    branches:
      - main
    paths:
      - "plugins/hexaemeron/harness/**"
      - "plugins/hexaemeron/tests/test_harness_*.py"
      - ".python-version"
      - "pyproject.toml"
      - ".github/workflows/hexaemeron-forge.yml"
  pull_request:
    paths:
      - "plugins/hexaemeron/harness/**"
      - "plugins/hexaemeron/tests/test_harness_*.py"
      - ".python-version"
      - "pyproject.toml"
      - ".github/workflows/hexaemeron-forge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Fetch the V2 and V1 protocol sources at their pinned commits and verify their digests
        run: python3 fetch_protocol.py
        working-directory: plugins/hexaemeron/harness
      - name: The harness bindings to the fetched source
        run: python3 -m unittest discover -s ../tests -t ../tests -p 'test_harness_*.py'
        working-directory: plugins/hexaemeron/harness
      - name: Build
        run: forge build
        working-directory: plugins/hexaemeron/harness
      - name: The emitter suite
        run: forge test -vv
        working-directory: plugins/hexaemeron/harness
      - name: Build the V1 suite under the V1 deployment compiler
        run: forge build
        working-directory: plugins/hexaemeron/harness
        env:
          FOUNDRY_PROFILE: v1
      - name: The V1 emitter suite
        run: forge test -vv
        working-directory: plugins/hexaemeron/harness
        env:
          FOUNDRY_PROFILE: v1
