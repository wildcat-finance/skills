name: lazarus

on:
  push:
    paths:
      - "plugins/lazarus/**"
      - ".python-version"
      - "pyproject.toml"
      - ".claude-plugin/**"
      - ".agents/**"
      - "AGENTS.md"
      - ".github/workflows/lazarus.yml"
  pull_request:
    paths:
      - "plugins/lazarus/**"
      - ".python-version"
      - "pyproject.toml"
      - ".claude-plugin/**"
      - ".agents/**"
      - "AGENTS.md"
      - ".github/workflows/lazarus.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: |
            plugins/lazarus/requirements.txt
            plugins/lazarus/requirements.lock
      - name: Install locked Lazarus dependencies
        run: python3 -m pip install --requirement plugins/lazarus/requirements.lock
      - name: Lazarus test suite
        run: python3 -m unittest discover -s plugins/lazarus/tests -t plugins/lazarus -v
