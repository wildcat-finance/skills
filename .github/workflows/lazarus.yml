name: lazarus

on:
  push:
    branches:
      - main
    paths:
      - "plugins/lazarus/**"
      - "docs/lazarus-multi-provider-chain-anchor/**"
      - "docs/lazarus-receipt-inclusion-proofs/**"
      - "docs/decisions/ADR-037-prove-receipts-with-a-full-ordered-witness.md"
      - ".python-version"
      - "pyproject.toml"
      - ".github/workflows/lazarus.yml"
  pull_request:
    paths:
      - "plugins/lazarus/**"
      - "docs/lazarus-multi-provider-chain-anchor/**"
      - "docs/lazarus-receipt-inclusion-proofs/**"
      - "docs/decisions/ADR-037-prove-receipts-with-a-full-ordered-witness.md"
      - ".python-version"
      - "pyproject.toml"
      - ".github/workflows/lazarus.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: |
            plugins/lazarus/requirements.txt
            plugins/lazarus/requirements.lock
      - name: Install locked Lazarus dependencies
        run: python3 -m pip install --requirement plugins/lazarus/requirements.lock
      - name: Lazarus test suite
        run: python3 -m unittest discover -s plugins/lazarus/tests -t plugins/lazarus -v

  darwin:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: |
            plugins/lazarus/requirements.txt
            plugins/lazarus/requirements.lock
      - name: Install locked Lazarus dependencies
        run: python3 -m pip install --requirement plugins/lazarus/requirements.lock
      - name: Complete Lazarus suite without skips
        run: |
          test ! -e .lazarus-ci
          python3 plugins/lazarus/tests/run_tests.py --elenchus-report .lazarus-ci/lazarus-darwin-tests.json
      - name: Goldfinch fixture and default-temporary release
        run: |
          python3 - <<'PY'
          import json
          import platform
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str(root / "plugins" / "lazarus" / "scripts"))
          from lazarus_lib.release import verify_release, write_release

          def _tree_bytes(directory):
              return {
                  path.relative_to(directory).as_posix(): path.read_bytes()
                  for path in sorted(directory.rglob("*"))
                  if path.is_file()
              }

          tests = json.loads(
              (root / ".lazarus-ci" / "lazarus-darwin-tests.json").read_text(
                  encoding="utf-8"
              )
          )
          if tests.get("schema") != "elenchus.unittest.v1" or not tests.get("complete"):
              raise AssertionError("the complete Lazarus test report is unavailable")
          if tests["testsRun"] <= 0:
              raise AssertionError("the complete Lazarus suite ran no tests")
          if tests["skipped"] != 0:
              raise AssertionError("the Darwin Lazarus suite skipped a regression")
          for outcome in (
              "failures",
              "errors",
              "expectedFailures",
              "unexpectedSuccesses",
          ):
              if tests[outcome] != 0:
                  raise AssertionError("the complete Darwin Lazarus suite was not green")

          environment = {
              "os": platform.system(),
              "architecture": platform.machine(),
              "python": platform.python_version(),
          }
          if environment["os"] != "Darwin" or environment["python"] != "3.14.6":
              raise AssertionError("the pinned Darwin execution environment changed")
          if not environment["architecture"]:
              raise AssertionError("the Darwin architecture is unavailable")

          demo = root / "plugins" / "lazarus" / "examples" / "goldfinch-v1" / "demo.py"
          checked_fixture = demo.parent
          checked_statement = (
              root
              / "plugins"
              / "lazarus"
              / "examples"
              / "goldfinch-v1-release"
              / "statement.json"
          )
          with tempfile.TemporaryDirectory() as directory:
              workspace = Path(directory)
              alias_class = workspace.parts[1] if len(workspace.parts) > 1 else ""
              if alias_class not in {"etc", "tmp", "var"}:
                  raise AssertionError("the default Darwin temporary root is not checked")

              rebuilt_fixture = workspace / "fixture"
              built = subprocess.run(
                  [sys.executable, str(demo), "build-fixture", "--out", str(rebuilt_fixture)],
                  cwd=root,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=False,
              )
              if built.returncode != 0:
                  raise AssertionError("the Goldfinch fixture rebuild failed")
              try:
                  fixture_event = json.loads(built.stdout)
              except (json.JSONDecodeError, TypeError):
                  raise AssertionError("the Goldfinch fixture event is malformed") from None
              if (
                  fixture_event.get("event") != "goldfinch_fixture_build"
                  or fixture_event.get("stage") != "complete"
              ):
                  raise AssertionError("the Goldfinch fixture rebuild is incomplete")
              if _tree_bytes(rebuilt_fixture) != _tree_bytes(checked_fixture):
                  raise AssertionError("the rebuilt Goldfinch fixture bytes changed")

              statement = workspace / "statement.json"
              shutil.copyfile(checked_statement, statement)
              release = workspace / "release"
              written = write_release(rebuilt_fixture, statement, release)
              verified = verify_release(release)
              if written["release_digest"] != verified["release_digest"]:
                  raise AssertionError("the rebuilt release did not verify")
              if fixture_event["fixture_digest"] != verified["fixture_digest"]:
                  raise AssertionError("the rebuilt fixture and release disagree")

          commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], cwd=root, text=True
          ).strip()
          evidence = {
              "schema": "lazarus.darwin-acceptance.v1",
              "event": "lazarus_darwin_acceptance",
              "stage": "complete",
              "commit": commit,
              "environment": environment,
              "tests": {
                  "run": tests["testsRun"],
                  "failures": tests["failures"],
                  "errors": tests["errors"],
                  "skipped": tests["skipped"],
                  "expected_failures": tests["expectedFailures"],
                  "unexpected_successes": tests["unexpectedSuccesses"],
              },
              "fixture": {
                  "comparison": "byte-identical",
                  "digest": fixture_event["fixture_digest"],
              },
              "release": {
                  "verified": True,
                  "fixture_digest": verified["fixture_digest"],
                  "digest": verified["release_digest"],
              },
              "darwin_root_alias": alias_class,
          }
          print(json.dumps(evidence, sort_keys=True, separators=(",", ":")))
          PY
