name: Refresh the contributor list

# Daily at 04:17 UTC, not per merge. Almost every merge here is the Shoggoth's
# own and changes no ranking, so a per-merge trigger would open an empty pull
# request most times it ran.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# The generated pull request touches CONTRIBUTORS.md and README.md only. It
# creates no workflow file, so GITHUB_TOKEN is sufficient here; the Workflows
# permission this repository's marketplace sync needs does not apply. The job
# also reads public merged-PR history from wildcat-finance/shoggoth-wave-atlas;
# that read needs no additional secret or permission.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-contributor-list
  cancel-in-progress: false

jobs:
  refresh:
    # A fork's schedule must not open pull requests against anything.
    if: github.repository == 'wildcat-finance/skills'
    runs-on: ubuntu-latest
    # No other workflow here sets this, because the others are pull-request CI
    # whose runs are bounded by the change that triggered them. This one is a
    # scheduled writer that makes network calls nobody is watching, so a hung
    # request would otherwise hold a runner until GitHub's six-hour ceiling.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Decide whether the ranking changed
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if python3 scripts/contributors.py --check; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            # 1 means an artefact is out of date, which is the whole point.
            # Anything else is a real failure and must not be papered over.
            if [ "$status" -ne 1 ]; then
              echo "contributors.py exited $status; not a staleness result" >&2
              exit "$status"
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate and read the ranking
        if: steps.decide.outputs.changed == 'true'
        id: rank
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/contributors.py --json > ranking.json
          python3 scripts/contributors.py --write
          {
            echo "digest=$(python3 -c "import json;print(json.load(open('ranking.json'))['digest'])")"
            echo "count=$(python3 -c "import json;print(len(json.load(open('ranking.json'))['contributors']))")"
          } >> "$GITHUB_OUTPUT"

      - name: Publish through the Contents API
        if: steps.decide.outputs.changed == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.rank.outputs.digest }}
        run: |
          set -euo pipefail
          branch="contributors/refresh-${DIGEST:0:12}"

          # Opening a second pull request for a ranking already proposed would
          # add noise every day until someone merged the first one.
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" \
            --state open --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "opened=false" >> "$GITHUB_OUTPUT"
            echo "reason=a pull request for this ranking is already open" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          # Tolerate only "already exists", from a previous run that got this far.
          # Swallowing every error here would hide a permission failure and leave
          # the Contents API writes to fail confusingly later.
          if ! create_error=$(gh api "repos/$GITHUB_REPOSITORY/git/refs" \
                 -f ref="refs/heads/$branch" -f sha="$base_sha" 2>&1 >/dev/null); then
            if ! printf '%s' "$create_error" | grep -qi 'already exists'; then
              printf 'could not create %s: %s\n' "$branch" "$create_error" >&2
              exit 1
            fi
          fi

          # Every branch in this repository requires signed commits. A plain
          # `git commit` from Actions is unsigned and its push is rejected, so
          # each file is written through the Contents API instead: GitHub signs
          # those commits with its own key and they verify.
          for path in CONTRIBUTORS.md README.md; do
            sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$branch" --jq .sha 2>/dev/null || true)
            # Built with printf rather than a literal multi-line string: a
            # continuation line at column 1 would end this block scalar and make
            # the whole workflow file unparseable, which is exactly what happened
            # once already.
            message=$(printf '%s\n\n%s\n%s\n' \
              "chore(contributors): refresh $path from contributor history" \
              "Generated by .github/workflows/contributors.yml running scripts/contributors.py." \
              "Reproduce with: python3 scripts/contributors.py --check")
            args=(-f message="$message"
                  -f content="$(base64 < "$path" | tr -d '\n')"
                  -f branch="$branch")
            if [ -n "$sha" ]; then args+=(-f sha="$sha"); fi
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" "${args[@]}" >/dev/null
          done

          url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "chore(contributors): refresh the ranked list" \
            --body "Generated by \`.github/workflows/contributors.yml\`. The ranking changed, so this refreshes \`CONTRIBUTORS.md\` and the README thanks block from Wildcat Skills and \`wildcat-finance/shoggoth-wave-atlas\` public history. Ranking digest \`${DIGEST}\`. Review the diff, not the generator: \`python3 scripts/contributors.py --check\` reproduces it.")
          echo "opened=true" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Say what happened
        if: always()
        run: |
          {
            echo "### Contributor list refresh"
            echo
            # job.status is checked first and deliberately. Without it a failed
            # decide step leaves `changed` empty, which reads as "not true", and
            # the summary would announce a clean no-op for a run that never got
            # far enough to decide anything.
            if [ "${{ job.status }}" != "success" ]; then
              echo "**This run failed.** Status \`${{ job.status }}\`. It did not"
              echo "establish whether the ranking changed, so treat the committed"
              echo "list as unverified rather than confirmed."
            elif [ "${{ steps.decide.outputs.changed }}" != "true" ]; then
              echo "No change. The committed list already matches both repositories' history."
              echo "A run that changes nothing is a success, not a skipped run."
            else
              echo "- ranking digest: \`${{ steps.rank.outputs.digest }}\`"
              echo "- contributors ranked: ${{ steps.rank.outputs.count }}"
              if [ "${{ steps.publish.outputs.opened }}" = "true" ]; then
                echo "- pull request opened: ${{ steps.publish.outputs.url }}"
              else
                echo "- pull request opened: no (${{ steps.publish.outputs.reason }})"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
